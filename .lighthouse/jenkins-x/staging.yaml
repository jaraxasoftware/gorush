apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: staging
spec:
  pipelineSpec:
    tasks:
    - name: build-gorush
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          env: 
          - name: ENVIRONMENT
            value: dkv-staging         
          image: uses:jaraxasoftware/jaraxa-pipeline-catalog/tasks/go/release.yaml@versionStream
          name: ""
          resources:
            # override limits for all containers here
            limits: {}
          workingDir: /workspace/source
        steps:
        - image: uses:jaraxasoftware/jaraxa-pipeline-catalog/tasks/git-clone/git-clone.yaml@versionStream
          name: ""
          resources: {}
        - name: next-version-uat
          resources: {}
          script: |
            #!/usr/bin/env sh
            jx-release-version -debug -previous-version=from-file:Chart.yaml -dir=charts/$APP_NAME -next-version=semantic:strip-prerelease -output-format "{{.Major}}.{{.Minor}}.{{.Patch}}"-UAT-$BUILD_ID > VERSION          
        - name: jx-variables
          resources: {}
        - name: build-make-build
          resources: {}
          script: |
            #/bin/sh
            make build_linux_amd64          
        - name: check-registry
          resources: {}
        - name: build-container-build
          resources: {}
        - name: promote-changelog-uat
          resources: {}
        - name: promote-helm-release
          resources: {}
        - name: promote-jx-promote
          resources: {}  
  podTemplate: {}
  serviceAccountName: tekton-bot
  timeout: 12h0m0s
status: {}
